<h2 class="mx-auto mt-2 max-w-lg text-center text-4xl font-semibold tracking-tight text-gray-950 sm:text-5xl">Book a Reservation</h2>&nbsp;&nbsp;
<p class="text-center text-base font-semibold text-indigo-600">You sure to make the reservation?</p>
<div class="relative lg:row-span-2">
<form (ngSubmit)="submitReservation()">
  

  <button type="submit">Confirm</button>
  <button type="button" (click)="cancelReservation()">Cancel</button>
</form>
</div>
